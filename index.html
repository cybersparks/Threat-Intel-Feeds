<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Threat Intel Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        h1 { color: #3564ff; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        h2 { color: #ebaa05; margin-top: 40px; margin-bottom: 15px; font-size: 1.4rem; }
        
        .status { font-size: 0.9em; color: #94a3b8; margin-bottom: 20px; }
        
        /* --- SOCIAL LINKS STYLING --- */
        .social-section {
            text-align: right;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #334155;
            margin-bottom: 20px;
        }
        .social-section a {
            color: #e9e9e9; /* Matches the pink accent color */
            text-decoration: none;
            font-weight: bold;
            margin-left: 15px;
            transition: color 0.2s;
        }
        .social-section a:hover {
            color: #fff;
            text-decoration: underline;
        }
        /* --------------------------- */
        
        .table-container { overflow-x: auto; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); border-radius: 8px; margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #334155; }
        
        th { background: #0f172a; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; }
        /* Specific header colors */
        .header-breaches th { color: #ec1c00; }
        .header-ransom th { color: #f70000; }

        tr:hover { background: #334155; }
        
        /* Column Widths */
        .col-company { width: 30%; }
        .col-count { width: 20%; text-align: center; }
        .col-date { width: 15%; }
        .col-summary { width: 35%; }
        
        /* Badges */
        .source-badge { 
            display: inline-block; 
            padding: 4px 10px; 
            border-radius: 20px; 
            background: #f50000; 
            color: #fff; 
            font-size: 0.7rem; 
            font-weight: bold; 
            text-transform: uppercase;
        }
        .ransom-badge { background: #fa0000; }

        /* Counts */
        .count-val { 
            color: #f52500; 
            font-weight: 800; 
            font-size: 1.1rem; 
        }

        /* Links */
        a { color: #38bdf8; text-decoration: none; transition: color 0.2s; }
        a:hover { color: #fff; text-decoration: underline; }
        
        #loading { text-align: center; color: #94a3b8; margin-top: 50px; font-size: 1.2rem; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #334155; border-top-color: #ec4899; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .error-msg { color: #ef4444; text-align: center; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Threat Intel Dashboard 🛡️  </h1>
        
        <!-- SOCIAL MEDIA SECTION START -->
        <div class="social-section">
            <!-- Update the href="#" below with your actual links -->
            <!-- Update the text with your username if you want -->
            <a href="https://x.com/cyb3r5parks" target="_blank">Created by X (Twitter)</a>
            
        </div>
        <!-- SOCIAL MEDIA SECTION ENDx
